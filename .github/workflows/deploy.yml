name: Upload files to S3

on:
  push:
    branches:
    - main

env:
  MY_AWS_REGION: 'ap-northeast-1'
  AWS_ROLENAME: 'test-role'
  AWS_S3_BUCKET: 'test-s3-auto-bucket'
  SOURCE_DIR: '.'
  DEST_DIR: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@main
    - name: Configure AWS credentials with IAM Role
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::992382417107:role/${{env.AWS_ROLENAME}}
        aws-region: ${{env.MY_AWS_REGION}}
    - name: Copy files to S3
      run: |
          aws s3 sync ${{env.SOURCE_DIR}} s3://${{env.AWS_S3_BUCKET}}/${{env.DEST_DIR}} --exclude '.*git*'